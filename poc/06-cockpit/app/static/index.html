<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div class="shell">
  <nav class="sidebar" aria-label="Hauptnavigation">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◳</span>
      <span class="brand-name">Freigabe-Cockpit</span>
    </div>
    <a href="#/posteingang" data-view="posteingang" class="nav-item">
      <span aria-hidden="true">▤</span>Posteingang <span class="nav-badge" id="badge-queue" hidden></span>
    </a>
    <a href="#/freigaben" data-view="freigaben" class="nav-item">
      <span aria-hidden="true">✓</span>Freigaben

    <a href="#/auswertung" data-view="auswertung" class="nav-item">

      <span class="mono">POC 06 · Stufe B</span>

  <div class="content">

      <h1 id="view-title">Posteingang</h1>
      <span class="env-badge">Demo — synthetische Belege</span>
      <span class="spacer"></span>
      <span class="engine-dot" id="engine-dot" title="Engine-Status"></span>
      <button class="icon-btn" id="theme-toggle" title="Theme wechseln (Light/Dark)"

    <main id="main" tabindex="-1"></main>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true"

<script src="app.js"></script>

</html>
